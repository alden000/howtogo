# 怎么去? — PREVIEW deploy config: identical to wrangler.toml except WITHOUT [assets].
# Why: in the agent environment an HTTPS proxy injects the Cloudflare API token on every request to
# api.cloudflare.com, overwriting the short-lived JWT of wrangler's /workers/assets/upload step (401).
# Deploy from the repo root: `npm run deploy:preview` (build:release → embed → wrangler deploy -c wrangler.preview.toml).
# Placeholders only — no secrets in this file. Secrets: see wrangler.toml.
name = "howtogo"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# No [assets]: `npm run embed -w @howtogo/worker` bundles src/web/dist (+ `_headers` rules) into
# src/generated/assets.ts and src/static.ts serves it (same paths, SPA fallback and headers).

[vars]
# Same-origin PWA on workers.dev, plus local dev (vite dev 5173, vite preview 4173, wrangler dev 8787).
ALLOWED_ORIGINS = "https://howtogo.wwweeeiii.com,https://howtogo.raus-ums.workers.dev,https://localhost,http://localhost:5173,http://localhost:4173,http://localhost:8787"
SHARE_TTL_HOURS = "4"
# FIXTURE_MODE "1": search/route/revgeocode/bus-arrival/alerts answer from bundled SYNTHETIC
# fixtures (AC 21) and /api/health reports fixtureMode:true, so the PWA shows the
# "示范路线 / Sample routes" banner. Preview only (D-10) — set to "0" once the owner's
# OneMap/LTA secrets are in.
FIXTURE_MODE = "1"

[[kv_namespaces]]
binding = "TOKEN_KV"
# Create with `npx wrangler kv namespace create TOKEN_KV` and paste the id here.
id = "1e514bcf1539494db863191de13f5d3c"

[[durable_objects.bindings]]
name = "TRIP_SHARE"
class_name = "TripShare"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TripShare"]

# Optional: reuse the LTA key of the owner's existing Worker via a service binding (src/lta.ts).
# Only used for bus arrival when the LTA_ACCOUNT_KEY secret is unset. Resolves only when this Worker
# is deployed to the SAME Cloudflare account as `whereisthebus-lta-proxy`; wrangler deploy errors if
# that Worker does not exist in the target account (remove this block for other accounts).
[[services]]
binding = "LTA_PROXY"
service = "whereisthebus-lta-proxy"

[observability]
enabled = false

# ---------------------------------------------------------------------------
# M3/M4 Worker round — mirrors the same block in wrangler.toml (keep both in sync).
# ---------------------------------------------------------------------------
# M4 AC 41: one-time caregiver setup box (ciphertext only, 24 h).
[[durable_objects.bindings]]
name = "SETUP_BOX"
class_name = "SetupBox"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SetupBox"]
# [env.test] (two-browser e2e) lives only in wrangler.toml.
