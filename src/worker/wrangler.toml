# 怎么去? API Worker. Placeholders only — no secrets in this file.
# Secrets (set with `wrangler secret put <NAME>`): ONEMAP_EMAIL, ONEMAP_PASSWORD, LTA_ACCOUNT_KEY
name = "howtogo-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://REPLACE-WITH-PAGES-DOMAIN.pages.dev"
SHARE_TTL_HOURS = "4"
# FIXTURE_MODE: "1" makes search/route/revgeocode/bus-arrival/alerts answer from bundled
# SYNTHETIC fixtures (AC 21). Dev/QA only — never set it here for production. Use:
#   npm run dev:fixtures -w @howtogo/worker   (= wrangler dev --var FIXTURE_MODE:1)

[[kv_namespaces]]
binding = "TOKEN_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "TRIP_SHARE"
class_name = "TripShare"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TripShare"]

[observability]
enabled = false
