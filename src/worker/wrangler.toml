# 怎么去? API Worker. Placeholders only — no secrets in this file.
# Secrets (set with `wrangler secret put <NAME>`): ONEMAP_EMAIL, ONEMAP_PASSWORD, LTA_ACCOUNT_KEY
name = "howtogo-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://REPLACE-WITH-PAGES-DOMAIN.pages.dev"
SHARE_TTL_HOURS = "4"
# FIXTURE_MODE: "1" makes search/route/revgeocode/bus-arrival/alerts answer from bundled
# SYNTHETIC fixtures (AC 21). Dev/QA only — never set it here for production. Use:
#   npm run dev:fixtures -w @howtogo/worker   (= wrangler dev --var FIXTURE_MODE:1)

[[kv_namespaces]]
binding = "TOKEN_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "TRIP_SHARE"
class_name = "TripShare"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TripShare"]

[observability]
enabled = false

# ---------------------------------------------------------------------------
# M3/M4 Worker round (dev/m34-worker) — additions only, appended so they merge cleanly with
# the static-assets change. Director: keep this block at the end when merging.
# ---------------------------------------------------------------------------
# M4 AC 41: one-time caregiver setup box (ciphertext only, 24 h).
[[durable_objects.bindings]]
name = "SETUP_BOX"
class_name = "SetupBox"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SetupBox"]

# M4 OQ6: test-only environment for the two-browser e2e (`wrangler dev --local --env test`).
# SHARE_TEST_TTL_SECONDS is honoured ONLY when ENVIRONMENT = "test"; test/config.test.ts fails if
# either appears outside this block. Bindings are not inherited by environments, so they are repeated.
[env.test]
name = "howtogo-api-test"

[env.test.vars]
ENVIRONMENT = "test"
SHARE_TEST_TTL_SECONDS = "90"
SHARE_TTL_HOURS = "4"
ALLOWED_ORIGINS = "http://localhost:4173,http://localhost:5173"

[[env.test.kv_namespaces]]
binding = "TOKEN_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[env.test.durable_objects.bindings]]
name = "TRIP_SHARE"
class_name = "TripShare"

[[env.test.durable_objects.bindings]]
name = "SETUP_BOX"
class_name = "SetupBox"
