<style>
/* Family viewer /t/:id — STYLE-GUIDE 6e.2. Tokens mirror §1 (no new tokens). */
:root{
  --ts:1;
  --font:"Atkinson Hyperlegible","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --c-canvas:#FBF5EC; --c-surface:#FFFFFF; --c-surface-2:#F3EADC; --c-line:#D9CBB6;
  --c-ink:#1D1915; --c-ink-2:#4A4038; --c-ink-inv:#FBF5EC;
  --c-primary:#9A3412; --c-primary-text:#8A2E0B;
  --c-jade:#0E5B49; --c-on-jade:#FFFFFF; --c-jade-soft:#D6EDE4; --c-on-jade-soft:#0A3F33;
  --c-saffron:#FFD23F; --c-on-saffron:#1D1915; --c-saffron-soft:#FFF1C2;
  --c-focus:#1D1915; --tint-home:#FBE3D3; --ink-home:#6E2409;
  --m-land:#F1E9DC; --m-block:#E3D6C2; --m-park:#CFE3C2; --m-water:#B9D9E4; --m-road:#FFFFFF; --m-casing:#D8C8B0; --m-exp:#F6D7A4; --m-label:#4A4038; --m-halo:#F1E9DC;
  --e-1:0 1px 2px rgba(60,40,20,.08),0 2px 8px rgba(60,40,20,.06);
  --e-2:0 2px 4px rgba(60,40,20,.08),0 8px 24px rgba(60,40,20,.10);
  --r-s:12px; --r-m:20px; --r-l:28px; --r-pill:999px; --tap:56px; --tap-hero:72px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --c-canvas:#14110E; --c-surface:#1F1A16; --c-surface-2:#2A231D; --c-line:#43392F;
  --c-ink:#F6EEE4; --c-ink-2:#CFC3B5; --c-ink-inv:#14110E;
  --c-primary:#FF9466; --c-primary-text:#FFA77F;
  --c-jade:#5FD3B0; --c-on-jade:#0A1F19; --c-jade-soft:#123A30; --c-on-jade-soft:#BDEFDF;
  --c-saffron-soft:#3D3212; --c-focus:#F6EEE4; --tint-home:#4A2414; --ink-home:#FFD9C6;
  --m-land:#1C1815; --m-block:#2B241E; --m-park:#1E2B20; --m-water:#162A33; --m-road:#3B332C; --m-casing:#2B241E; --m-exp:#4A3A22; --m-label:#CFC3B5; --m-halo:#1C1815;
  --e-1:0 1px 2px rgba(0,0,0,.4); --e-2:0 4px 16px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --c-canvas:#14110E; --c-surface:#1F1A16; --c-surface-2:#2A231D; --c-line:#43392F;
  --c-ink:#F6EEE4; --c-ink-2:#CFC3B5; --c-ink-inv:#14110E;
  --c-primary:#FF9466; --c-primary-text:#FFA77F;
  --c-jade:#5FD3B0; --c-on-jade:#0A1F19; --c-jade-soft:#123A30; --c-on-jade-soft:#BDEFDF;
  --c-saffron-soft:#3D3212; --c-focus:#F6EEE4; --tint-home:#4A2414; --ink-home:#FFD9C6;
  --m-land:#1C1815; --m-block:#2B241E; --m-park:#1E2B20; --m-water:#162A33; --m-road:#3B332C; --m-casing:#2B241E; --m-exp:#4A3A22; --m-label:#CFC3B5; --m-halo:#1C1815;
  --e-1:0 1px 2px rgba(0,0,0,.4); --e-2:0 4px 16px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(20px * var(--ts));-webkit-text-size-adjust:100%;background:var(--c-canvas)}
body{margin:0;font-family:var(--font);color:var(--c-ink);background:var(--c-canvas);line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--c-focus);outline-offset:3px;border-radius:var(--r-s)}
svg.i{width:1.4em;height:1.4em;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

.hdr{display:flex;align-items:center;gap:10px;padding:8px 20px;min-height:72px;max-width:1600px;margin:0 auto}
.hdr .mark{width:36px;height:36px;flex:none}
.hdr .name{font-weight:900;font-size:.95rem}
.hdr .grow{flex:1}
.langbtn{min-height:var(--tap);min-width:var(--tap);padding:0 18px;border-radius:var(--r-pill);background:var(--c-surface);box-shadow:var(--e-1);font-weight:700;font-size:.95rem}

.layout{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"note" "status" "map" "rest";gap:16px;max-width:560px;margin:0 auto;padding:0 20px 32px}
.notearea{grid-area:note}.statusarea{grid-area:status}.maparea{grid-area:map}.restarea{grid-area:rest}
.notearea:empty{display:none}
.card{padding:20px;border-radius:var(--r-l);background:var(--c-surface);box-shadow:var(--e-1)}
.who{display:flex;gap:14px;align-items:flex-start}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.3rem;flex:none;background:var(--tint-home);color:var(--ink-home)}
.avatar.ok{background:var(--c-jade);color:var(--c-on-jade)}
.avatar.ok svg{width:34px;height:34px;stroke-width:3}
.who h1{margin:0;font-size:1.5rem;line-height:1.2;font-weight:700;text-wrap:balance;min-width:0;flex:1}
.who p{margin:6px 0 0;color:var(--c-ink-2);font-size:1rem}
.eta{margin-top:16px}
.eta b{display:block;font-size:2.1rem;line-height:1.15;font-weight:900;min-height:1.15em}
.eta span{display:block;margin-top:4px;font-size:1.2rem;font-weight:700;color:var(--c-ink-2)}
.pill{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:var(--r-m);background:var(--c-jade-soft);color:var(--c-on-jade-soft);font-weight:700;font-size:1rem;line-height:1.3}
.pill.grey{background:var(--c-surface-2);color:var(--c-ink)}
.dest{margin-top:16px;padding:14px;border-radius:var(--r-m);background:var(--c-surface-2);font-weight:700}

.helpbox{padding:20px;border-radius:var(--r-l);background:var(--c-saffron);color:var(--c-on-saffron);box-shadow:var(--e-2)}
.helpbox .who h1{font-weight:900}
.helpbox .avatar{background:var(--c-on-saffron);color:var(--c-saffron)}
.helpbox p{margin:10px 0 0;font-size:1.1rem;font-weight:700}
.helpbox .btn{margin-top:16px;background:#1D1915;color:#FFD23F}
.helpbox .near{font-weight:400;font-size:1rem}

.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-m);background:var(--c-surface-2);color:var(--c-ink);font-size:1rem}
.note.jade{background:var(--c-jade-soft);color:var(--c-on-jade-soft);font-weight:700}
.note b{display:block}
.note span{display:block;margin-top:4px;color:var(--c-ink-2)}
.note.jade span{color:inherit}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--c-jade-soft);border-top-color:var(--c-jade);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

.map{position:relative;height:300px;border-radius:var(--r-l);overflow:hidden;background:var(--m-land);box-shadow:var(--e-1)}
.map svg.m{position:absolute;inset:0;width:100%;height:100%}
.attrib{position:absolute;left:8px;bottom:6px;font-size:11px;line-height:1.2;padding:2px 6px;border-radius:6px;background:var(--m-halo);color:var(--m-label)}
.locbtn{position:absolute;right:12px;top:12px;width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;background:var(--c-surface);box-shadow:var(--e-2)}
.m-road{stroke:var(--m-road);stroke-linecap:round;fill:none}
.m-case{stroke:var(--m-casing);stroke-linecap:round;fill:none}
.m-exp{stroke:var(--m-exp);stroke-linecap:round;fill:none}
.m-lbl{font:700 15px var(--font);fill:var(--m-label);paint-order:stroke;stroke:var(--m-halo);stroke-width:5px;stroke-linejoin:round}
.puck{fill:var(--c-primary);stroke:#fff;stroke-width:5}
.puck.grey{fill:var(--c-ink-2)}
.acc{fill:var(--c-primary);opacity:.14}
.pulse{fill:none;stroke:var(--c-primary);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:.8}to{transform:scale(2.2);opacity:0}}
.dot{fill:#FFD23F;stroke:#1D1915;stroke-width:3}
.ring{fill:none;stroke:#FFD23F;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:ring 1.2s ease-out 1 both}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(2.6);opacity:0}}

.upd{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--c-ink-2)}
.upd i{width:10px;height:10px;border-radius:50%;background:var(--c-jade);animation:blink 1.6s infinite;flex:none}
.upd i.off{background:transparent;border:2px solid var(--c-ink-2);animation:none}
@keyframes blink{50%{opacity:.25}}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:var(--tap-hero);padding:12px 24px;border-radius:var(--r-l);font-weight:700;font-size:1.15rem;line-height:1.2;text-align:center;text-decoration:none}
.btn svg.i{width:1.5em;height:1.5em}
.btn-jade{background:var(--c-jade);color:var(--c-on-jade)}
.rest{display:flex;flex-direction:column;gap:16px}
.foot{font-size:.9rem;color:var(--c-ink-2);text-align:center}
.foot p{margin:0 0 6px}
details.what{font-size:.9rem;color:var(--c-ink-2)}
details.what summary{min-height:var(--tap);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c-primary-text);text-decoration:underline;text-underline-offset:4px;font-weight:700;list-style:none}
details.what summary::-webkit-details-marker{display:none}
details.what p{margin:0 0 8px;text-align:left}
.skel{border-radius:var(--r-l);background:var(--c-surface-2);animation:blink 1.6s infinite}
.proto{margin-top:8px;padding:12px;border:2px dashed var(--c-line);border-radius:var(--r-m);font-size:.85rem;color:var(--c-ink-2)}
.proto label{display:block;font-weight:700;margin-bottom:6px}
.proto select{width:100%;min-height:var(--tap);border-radius:var(--r-s);border:2px solid var(--c-line);background:var(--c-surface);padding:0 10px;font-size:1rem}

@media (min-width:1000px){
  .layout{max-width:1600px;grid-template-columns:minmax(440px,22rem) minmax(400px,1fr);grid-template-areas:"note map" "status map" "rest map";grid-template-rows:auto auto 1fr;column-gap:24px;padding:0 24px 24px;align-items:start}
  .maparea{position:sticky;top:12px;align-self:stretch}
  .map{height:calc(100dvh - 108px);min-height:520px}
  .layout.nomap{grid-template-columns:minmax(0,640px);justify-content:center;grid-template-areas:"note" "status" "rest"}
}
@media (prefers-reduced-motion:reduce){ .pulse,.ring{display:none} .upd i,.skel{animation:none} .spin{animation-duration:2.4s} }
</style>
</head>

<header class="hdr">
  <svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="96" fill="#9A3412"/><g fill="none" stroke="#FBF5EC" stroke-linecap="round" stroke-linejoin="round" stroke-width="64"><path d="M256 64V192M192 96H320M96 192H416M256 288L160 416H288"/></g><circle cx="384" cy="408" r="48" fill="#FFD23F"/></svg>

<script>
'use strict';
const qs=new URLSearchParams(location.search);
const store=(()=>{try{return localStorage}catch(e){return null}})();
const V={lang:qs.get('lang')||((()=>{try{return store&&store.getItem('zmq-viewer-lang')}catch(e){return null}})())||'zh', state:qs.get('state')||'bus'};
if(qs.get('theme')) document.documentElement.dataset.theme=qs.get('theme');
if(qs.get('ts')) document.documentElement.style.setProperty('--ts',qs.get('ts'));
const Z=(zh,en)=>V.lang==='zh'?zh:en;
const ic=n=>`<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
/* Sample share: the sharer's contact record says Mei Ling calls her 妈妈 / Mum (6e.4). */
const ME={zh:'妈妈',en:'Mum'}, DEST={zh:'陈笃生医院',en:'Tan Tock Seng Hospital'};
const me=()=>Z(ME.zh,ME.en), dest=()=>Z(DEST.zh,DEST.en);
const STATES=['loading','waiting','walk','wait','bus','train','help','helpcleared','arrived','nosignal','ended','endedArrived','expired','invalid','offline'];
const LABEL={loading:'Loading',waiting:'Waiting (not set off)',walk:'Travelling: walking',wait:'Travelling: waiting for bus',bus:'Travelling: on bus',train:'Travelling: on train',help:'Help requested',helpcleared:'Help cleared',arrived:'Arrived',nosignal:'Paused / no signal',ended:'Ended by sharer',endedArrived:'Ended after arrival',expired:'Link expired',invalid:'Link invalid',offline:'Viewer offline (on bus)'};

const onWay=()=>Z(`${me()}正在去 ${dest()}`,`${me()} is on the way to ${dest()}`);
const etaB=Z('约 上午 10:39 到达','Arriving about 10:39 am'), etaS=Z('还有 16 分钟','16 min to go');
const callBtn=()=>`<a class="btn btn-jade" href="tel:+6591234567" data-testid="viewer-call">${ic('phone')}${Z('打电话给'+me(),'Call '+me())}</a>`;
const upd=(t,off)=>`<div class="upd"><i class="${off?'off':''}" aria-hidden="true"></i><span aria-live="off">${t}</span></div>`;
const foot=()=>`<div class="foot"><p>${Z(me()+'到了 30 分钟后，这个链接会停止（最长 4 小时）。','This link stops 30 minutes after '+me()+' arrives (4 hours at most).')}</p><p>${Z('怎么去? 不会保存任何人的位置。','怎么去? doesn’t keep anyone’s location.')}</p>
  <details class="what"><summary>${Z('这是什么？','What is this?')}</summary><p>${Z('怎么去? 是一个帮长辈坐巴士和地铁的应用。'+me()+'用它一步一步地走，也用它让家人看到她在哪里。','怎么去? helps older people take the bus and train, one step at a time. '+me()+' uses it to get around, and to let family see where she is.')}</p></details></div>`;
const avatar=()=>`<span class="avatar" aria-hidden="true">林</span>`;
const pill=(i,t,grey)=>`<div class="pill ${grey?'grey':''}">${ic(i)}<span>${t}</span></div>`;

function build(st){
  const S={note:'',status:'',map:null,rest:'',title:'',live:'',assertive:false};
  const travel=(i,t)=>{S.status=`<section class="card" aria-labelledby="st">${'<div class="who">'+avatar()+`<h1 id="st">${onWay()}</h1></div>`}<div class="eta"><b class="num">${etaB}</b><span class="num">${etaS}</span></div>${pill(i,t)}</section>`;
    S.map={puck:[430,330]}; S.rest=upd(Z('刚刚更新','Updated just now'))+callBtn()+foot(); S.title=onWay(); S.live=onWay()+'。'+t;};
  switch(st){
    case 'loading': S.status=`<div class="card" aria-busy="true"><div class="skel" style="height:2.4rem"></div><div class="skel" style="height:3rem;margin-top:14px"></div></div><div class="note" style="margin-top:12px" role="status"><span class="spin" aria-hidden="true"></span><b>${Z('正在打开…','Opening…')}</b></div>`; S.title=Z('家人的行程','A family member’s trip'); break;
    case 'waiting': S.status=`<section class="card"><div class="who">${avatar()}<div style="min-width:0;flex:1"><h1>${Z(me()+'还没出发',me()+' hasn’t set off yet')}</h1><p>${Z('她出发后，这里会显示她在哪里。','Once she sets off, you’ll see where she is here.')}</p></div></div><div class="dest">${Z('要去：','Going to: ')}${dest()}</div></section>`;
      S.rest=callBtn()+foot(); S.title=Z(me()+'还没出发',me()+' hasn’t set off yet'); S.live=S.title; break;
    case 'walk': travel('walk',Z('正在走路去 Blk 79 巴士站','Walking to the Blk 79 bus stop')); S.map.puck=[600,250]; break;
    case 'wait': travel('clock',Z('在 Blk 79 巴士站 等 139 号巴士','Waiting at Blk 79 for bus 139')); S.map.puck=[560,300]; break;
    case 'bus': case 'offline': travel('bus',Z('在 139 号巴士上，还有 3 站','On bus 139, 3 stops to go'));
      if(st==='offline') S.note=`<div class="note" role="status"><span class="spin" aria-hidden="true"></span><div><b>${Z('你的网络断了，正在重新连接…','Your internet dropped. Reconnecting…')}</b></div></div>`;
      if(st==='offline') S.rest=upd(Z('2 分钟前更新','Updated 2 min ago'),true)+callBtn()+foot(); break;
    case 'train': travel('train',Z('在地铁上，往 滨海南码头 Marina South Pier 方向，还有 1 站','On the train towards Marina South Pier, 1 stop to go')); S.map.puck=[380,380]; break;
    case 'help': S.status=`<section class="helpbox" aria-labelledby="st">${'<div class="who">'+`<span class="avatar" aria-hidden="true">${ic('help')}</span><h1 id="st">${Z(me()+'按了“帮忙”',me()+' tapped Help')}</h1></div>`}<p>${Z('她可能需要你。请打电话给她。','She may need you. Please give her a call.')}</p><a class="btn" href="tel:+6591234567" data-testid="viewer-call">${ic('phone')}${Z('打电话给'+me(),'Call '+me())}</a><p class="near">${Z('她现在在 Toa Payoh Lorong 4 附近','She’s near Toa Payoh Lorong 4 now')}</p></section>`;
      S.map={puck:[560,300]}; S.rest=upd(Z('刚刚更新','Updated just now'))+foot(); S.title=Z(me()+'按了帮忙',me()+' tapped Help'); S.live=Z(me()+'按了帮忙。她可能需要你。',me()+' tapped Help. She may need you.'); S.assertive=true; break;
    case 'helpcleared': travel('bus',Z('在 139 号巴士上，还有 3 站','On bus 139, 3 stops to go')); S.note=`<div class="note jade" role="status">${ic('check')}<div><b>${Z(me()+'说她没事了。',me()+' says she’s okay now.')}</b></div></div>`; break;
    case 'arrived': S.status=`<section class="card"><div class="who"><span class="avatar ok" aria-hidden="true">${ic('check')}</span><h1>${Z(me()+'已经到了 '+dest(),me()+' has arrived at '+dest())}</h1></div><div class="eta"><b class="num">${Z('上午 10:38 到的','Arrived at 10:38 am')}</b></div>${pill('clock',Z('分享会在 上午 11:08 停止','Sharing stops at 11:08 am'))}</section>`;
      S.map={puck:[255,505],arrived:true}; S.rest=upd(Z('刚刚更新','Updated just now'))+callBtn()+foot(); S.title=Z(me()+'到了',me()+' has arrived'); S.live=Z(me()+'已经到了 '+dest(),me()+' has arrived at '+dest()); break;
    case 'nosignal': S.status=`<section class="card"><div class="who">${avatar()}<h1>${Z(me()+'的手机暂时没有信号',me()+'’s phone has no signal right now')}</h1></div><div class="eta"><b class="num">${etaB}</b><span class="num">${Z('（可能有变化）','(may change)')}</span></div><div class="note" style="margin-top:16px">${ic('wifi-off')}<div><b>${Z('最后位置：Novena 站附近，5 分钟前','Last seen near Novena station, 5 min ago')}</b><span>${Z('在地铁里或大楼里常常这样，信号回来后会自己更新。','This often happens in the MRT or inside buildings. It will update by itself when the signal returns.')}</span></div></div></section>`;
      S.map={puck:[380,380],grey:true}; S.rest=upd(Z('5 分钟前更新','Updated 5 min ago'),true)+callBtn()+foot(); S.title=Z(me()+'的手机暂时没有信号',me()+'’s phone has no signal'); S.live=S.title; break;
    case 'ended': S.status=`<section class="card"><div class="who">${avatar()}<div style="min-width:0;flex:1"><h1>${Z(me()+'停止了分享',me()+' stopped sharing')}</h1><p>${Z('想知道她在哪里，可以打电话给她。','To find out where she is, you can call her.')}</p></div></div></section>`; S.rest=callBtn()+foot(); S.title=Z(me()+'停止了分享',me()+' stopped sharing'); S.live=S.title; break;
    case 'endedArrived': S.status=`<section class="card"><div class="who"><span class="avatar ok" aria-hidden="true">${ic('check')}</span><h1>${Z(me()+'已经到了 '+dest()+'。分享结束了。',me()+' arrived at '+dest()+'. Sharing has ended.')}</h1></div></section>`; S.rest=callBtn()+foot(); S.title=Z(me()+'到了',me()+' has arrived'); S.live=S.title; break;
    case 'expired': S.status=`<section class="card"><div class="who"><span class="avatar" aria-hidden="true">${ic('clock')}</span><div style="min-width:0;flex:1"><h1>${Z('这个链接已经过期了','This link has expired')}</h1><p>${Z('分享最长 4 小时。可以请'+me()+'再发一个。','Sharing lasts 4 hours at most. You can ask '+me()+' for a new one.')}</p></div></div></section>`; S.rest=callBtn()+foot(); S.title=Z('链接过期了','Link expired'); S.live=S.title; break;
    case 'invalid': S.status=`<section class="card"><div class="who"><span class="avatar" aria-hidden="true">${ic('link')}</span><div style="min-width:0;flex:1"><h1>${Z('找不到这个链接','We can’t find this link')}</h1><p>${Z('请检查链接是否完整，或请家人再发一次。','Check the whole link was copied, or ask your family member to send it again.')}</p></div></div></section>`; S.rest=`<div class="foot"><p>${Z('怎么去? 不会保存任何人的位置。','怎么去? doesn’t keep anyone’s location.')}</p></div>`; S.title=Z('找不到链接','Link not found'); S.live=S.title; break;
  }
  return S;
}
function mapSvg(m){
  const [px,py]=m.puck, d=[255,505];
  const lbl=(x,y,t)=>`<text class="m-lbl" x="${x}" y="${y}">${t}</text>`;
  return `<svg class="m" viewBox="0 0 800 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect width="800" height="640" fill="var(--m-land)"/>
  <path d="M0 560 Q180 520 300 600 T800 590 V640 H0Z" fill="var(--m-water)"/>
  <rect x="80" y="80" width="170" height="120" rx="18" fill="var(--m-park)"/>
  ${[[300,70,120,90],[460,60,140,100],[630,120,120,80],[90,260,120,110],[470,380,130,90],[620,300,130,120],[130,420,90,70]].map(([x,y,w,h])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="var(--m-block)"/>`).join('')}
  <path class="m-exp" d="M-20 230 L820 210" stroke-width="22"/>
  <g class="m-case" stroke-width="20"><path d="M260 -20 V660"/><path d="M-20 350 H820"/><path d="M600 -20 L560 660"/><path d="M260 500 H820"/></g>
  <g class="m-road" stroke-width="14"><path d="M260 -20 V660"/><path d="M-20 350 H820"/><path d="M600 -20 L560 660"/><path d="M260 500 H820"/></g>
  ${lbl(276,40,'Thomson Rd')}${lbl(30,338,'Balestier Rd')}${lbl(612,40,'Toa Payoh Lor 4')}${lbl(96,150,'Novena')}
  ${m.grey?'':`<circle class="acc" cx="${px}" cy="${py}" r="46"/>`}
  <g><circle class="dot" cx="${d[0]}" cy="${d[1]}" r="18"/>${m.arrived?`<circle class="ring" cx="${d[0]}" cy="${d[1]}" r="18"/>`:''}</g>
  ${m.arrived||m.grey?'':`<circle class="pulse" cx="${px}" cy="${py}" r="16"/>`}
  <circle class="puck ${m.grey?'grey':''}" cx="${px}" cy="${py}" r="15"/>
  </svg>`;
}
let lastState=null;
function render(){
  const h=document.documentElement; h.lang=V.lang==='zh'?'zh-Hans':'en-SG';
  const lb=document.getElementById('lang'); lb.textContent=V.lang==='zh'?'English':'中文'; lb.lang=V.lang==='zh'?'en':'zh-Hans'; lb.setAttribute('aria-label',V.lang==='zh'?'Switch to English':'切换到中文');
  const S=build(V.state);
  document.getElementById('note').innerHTML=S.note;
  document.getElementById('status').innerHTML=S.status;
  const ma=document.getElementById('maparea');
  ma.innerHTML=S.map?`<div class="map" role="img" aria-label="${Z(me()+'现在的位置和目的地的地图','Map of where '+me()+' is and where she is going')}">${mapSvg(S.map)}<button class="locbtn" aria-label="${Z('回到她的位置','Back to her position')}">${ic('locate')}</button><span class="attrib">Map data © OneMap / Singapore Land Authority</span></div>`:'';
  document.getElementById('app').classList.toggle('nomap',!S.map);
  document.getElementById('rest').innerHTML=S.rest+(qs.get('clean')?'':`<div class="proto"><label for="pst">Prototype only — viewer state (STYLE-GUIDE 6e.2)</label><select id="pst">${STATES.map(s=>`<option value="${s}" ${s===V.state?'selected':''}>${s} — ${LABEL[s]}</option>`).join('')}</select></div>`);
  const ps=document.getElementById('pst'); if(ps) ps.onchange=()=>{V.state=ps.value;render();};
  document.title=(S.title?S.title+' · ':'')+'怎么去?';
  if(lastState!==V.state){ if(S.live){const el=document.getElementById(S.assertive?'live2':'live'); el.textContent=''; setTimeout(()=>el.textContent=S.live,30);}
    try{ if(navigator.vibrate){ if(V.state==='help') navigator.vibrate([60,80,60]); if(V.state==='arrived') navigator.vibrate([20,40,20]); } }catch(e){}
    lastState=V.state; }
}
document.getElementById('lang').onclick=()=>{V.lang=V.lang==='zh'?'en':'zh'; try{store&&store.setItem('zmq-viewer-lang',V.lang)}catch(e){} lastState=null; render();};
render();
</script>
