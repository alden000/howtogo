<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 272" width="280" height="272" aria-hidden="true" focusable="false">
<style>.ig-surf{fill:var(--c-surface,#FFFFFF);stroke:var(--c-line,#D9CBB6);stroke-width:2}.ig-quiet{fill:var(--c-surface-2,#F3EADC)}.ig-bar{fill:var(--c-line,#D9CBB6)}.ig-rule{stroke:var(--c-line,#D9CBB6);stroke-width:2}.ig-glyph{fill:none;stroke:var(--c-ink-2,#4A4038);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.ig-hi{fill:var(--c-saffron-soft,#FFF1C2);stroke:#FFD23F;stroke-width:4}.ig-text{fill:var(--c-ink,#1D1915);font:700 15px "Atkinson Hyperlegible","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}.ig-sub{fill:var(--c-ink-2,#4A4038);font:400 13px "Atkinson Hyperlegible","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}.ig-title{fill:var(--c-ink,#1D1915);font:700 16px "Atkinson Hyperlegible","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}.ig-on{fill:var(--c-jade,#0E5B49)}.ig-off{fill:var(--c-line,#D9CBB6)}.ig-knob{fill:var(--c-surface,#FFFFFF)}.ig-ring{fill:none;stroke:var(--c-ink-2,#4A4038);stroke-width:2.4}.ig-pick{fill:var(--c-ink,#1D1915)}.ig-dim{fill:var(--c-ink,#1D1915);opacity:.14}.ig-btn{fill:var(--c-surface-2,#F3EADC)}</style>
<rect class="ig-surf" x="20" y="4" width="240" height="264" rx="18"/><rect class="ig-dim" x="21" y="5" width="238" height="262" rx="17"/><rect class="ig-surf" x="34" y="22" width="212" height="234" rx="22"/>
<text class="ig-title" x="140" y="50" text-anchor="middle">Manage manually</text><rect class="ig-hi" x="44" y="66" width="192" height="38" rx="12"/><text class="ig-text" x="56" y="90">Auto-launch</text><rect class="ig-on" x="182" y="75" width="44" height="20" rx="10"/><circle class="ig-knob" cx="216" cy="85" r="7"/><rect class="ig-hi" x="44" y="110" width="192" height="38" rx="12"/><text class="ig-text" x="56" y="134">Secondary</text><text class="ig-text" x="56" y="153">launch</text><rect class="ig-on" x="182" y="119" width="44" height="20" rx="10"/><circle class="ig-knob" cx="216" cy="129" r="7"/><rect class="ig-hi" x="44" y="154" width="192" height="38" rx="12"/><text class="ig-text" x="56" y="178">Run in</text><text class="ig-text" x="56" y="197">background</text><rect class="ig-on" x="182" y="163" width="44" height="20" rx="10"/><circle class="ig-knob" cx="216" cy="173" r="7"/><rect class="ig-btn" x="48" y="202" width="86" height="36" rx="18"/><text class="ig-text" x="91" y="225" text-anchor="middle">Cancel</text><rect class="ig-hi" x="146" y="202" width="86" height="36" rx="18"/><text class="ig-text" x="189" y="225" text-anchor="middle">OK</text>
