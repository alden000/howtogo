<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 238" width="280" height="238" aria-hidden="true" focusable="false">
<style>.ig-surf{fill:var(--c-surface,#FFFFFF);stroke:var(--c-line,#D9CBB6);stroke-width:2}.ig-quiet{fill:var(--c-surface-2,#F3EADC)}.ig-bar{fill:var(--c-line,#D9CBB6)}.ig-rule{stroke:var(--c-line,#D9CBB6);stroke-width:2}.ig-glyph{fill:none;stroke:var(--c-ink-2,#4A4038);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.ig-hi{fill:var(--c-saffron-soft,#FFF1C2);stroke:#FFD23F;stroke-width:4}.ig-text{fill:var(--c-ink,#1D1915);font:700 15px "Atkinson Hyperlegible","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}.ig-sub{fill:var(--c-ink-2,#4A4038);font:400 13px "Atkinson Hyperlegible","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}.ig-title{fill:var(--c-ink,#1D1915);font:700 16px "Atkinson Hyperlegible","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}.ig-on{fill:var(--c-jade,#0E5B49)}.ig-off{fill:var(--c-line,#D9CBB6)}.ig-knob{fill:var(--c-surface,#FFFFFF)}.ig-ring{fill:none;stroke:var(--c-ink-2,#4A4038);stroke-width:2.4}.ig-pick{fill:var(--c-ink,#1D1915)}.ig-dim{fill:var(--c-ink,#1D1915);opacity:.14}.ig-btn{fill:var(--c-surface-2,#F3EADC)}</style>
<rect class="ig-surf" x="20" y="4" width="240" height="230" rx="18"/>
<path class="ig-glyph" d="M38 28l-7 7 7 7"/><text class="ig-title" x="52" y="40">Install unknown apps</text><text class="ig-sub" x="36" y="78">Chrome</text><rect class="ig-hi" x="199" y="97" width="58" height="40" rx="20"/><rect class="ig-on" x="206" y="107" width="44" height="20" rx="10"/><circle class="ig-knob" cx="240" cy="117" r="7"/><text class="ig-text" x="36" y="112">Allow from this</text><text class="ig-text" x="36" y="131">source</text><text class="ig-sub" x="36" y="166">When your phone asks first,</text><text class="ig-sub" x="36" y="182">tap "Settings" to come</text><text class="ig-sub" x="36" y="198">here. Turn it on, then go</text><text class="ig-sub" x="36" y="214">back.</text>
</svg>
